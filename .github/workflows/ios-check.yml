# Compiles the iOS app without signing on every push and pull request, so build errors show up early.
name: iOS build check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build web app and sync iOS project
        run: |
          npm ci
          ./build.sh
          npx cap sync ios
      - name: Compile (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO build

